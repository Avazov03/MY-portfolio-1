  <style>
    :root {
      --ink: #0D0D0D;
      --paper: #FAFAFA;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Plus Jakarta Sans", sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow-x: clip;
    }

    .page {
      min-height: 100dvh;
      height: 100dvh;
      position: relative;
      overflow: hidden;
    }

    .split-m {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.68fr);
      height: 100%;
    }

    .media-pane {
      position: relative;
      background: #050505;
      min-height: 42vh;
      overflow: hidden;
    }
    /* Video fills allocated stage; subject locked to center — not tiny, not blown up */
    .media-pane__stage {
      position: absolute;
      inset: clamp(10px, 2.2vh, 24px);
      overflow: hidden;
      border-radius: 18px;
      background: #000;
    }
    .media-pane video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 22%;
      display: block;
      pointer-events: none;
      transform: none;
    }
    .veil {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, transparent 50%, rgba(0,0,0,.5));
      border-radius: inherit;
    }
    .media-copy {
      position: absolute;
      left: clamp(1.25rem, 2.5vw, 2rem);
      bottom: clamp(1.25rem, 3vh, 2.25rem);
      z-index: 10;
      max-width: min(22rem, 70%);
      pointer-events: none;
    }

    .form-pane {
      background: #0D0D0D;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(1.25rem, 3vh, 2.25rem) clamp(1.1rem, 2.2vw, 1.75rem);
      border-left: 1px solid rgba(255,255,255,.06);
      overflow-y: auto;
    }

    .field {
      width: 100%;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.04);
      color: #fff;
      border-radius: 14px;
      padding: 11px 14px;
      font-size: 13px;
      outline: none;
    }
    .field::placeholder { color: rgba(255,255,255,.35); }
    .field:focus {
      border-color: rgba(255,255,255,.45);
      background: rgba(255,255,255,.07);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-decoration: none;
      border: 0;
      cursor: pointer;
    }
    .btn-white { background: #fff; color: #0D0D0D; }
    .btn-ghost {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255,255,255,.28);
    }
    .channel {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      text-decoration: none;
      color: inherit;
      transition: border-color .2s, background .2s;
    }
    .channel:hover {
      border-color: rgba(255,255,255,.4);
      background: rgba(255,255,255,.04);
    }
    .dot {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.08);
      flex-shrink: 0;
      color: #fff;
    }
    .dot img {
      width: 17px;
      height: 17px;
      display: block;
    }

    .ready-label {
      margin-top: 1.1rem;
      margin-bottom: 0.45rem;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,.4);
    }
    .ready-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .ready-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      border: 1px solid rgba(255,255,255,.16);
      background: transparent;
      color: rgba(255,255,255,.78);
      cursor: pointer;
      transition: border-color .2s, background .2s, color .2s;
    }
    .ready-chip:hover,
    .ready-chip.is-on {
      border-color: #fff;
      background: #fff;
      color: #0D0D0D;
    }

    .float-wrap { position: relative; }
    .float-wrap label {
      position: absolute;
      left: 14px;
      top: 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(255,255,255,.34);
      pointer-events: none;
      transition: top .15s ease, font-size .15s ease, color .15s ease;
    }
    .float-wrap .field {
      padding-top: 22px;
      padding-bottom: 8px;
    }
    .float-wrap .field:focus + label,
    .float-wrap .field:not(:placeholder-shown) + label {
      top: 6px;
      font-size: 9px;
      color: rgba(255,255,255,.55);
    }
    .float-wrap textarea.field {
      min-height: 96px;
      resize: vertical;
    }
    .back-link {
      position: absolute;
      top: 1.25rem;
      left: 1.25rem;
      z-index: 30;
    }

    @media (max-width: 899px) {
      .page { height: auto; min-height: 100dvh; overflow: visible; }
      .split-m {
        display: grid !important;
        grid-template-columns: 1fr !important;
      }
      .media-pane { min-height: 52vh; height: 52vh; }
      .media-pane__stage { inset: 10px; border-radius: 14px; }
      .media-pane video { object-position: center 18%; }
      .veil { background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,.72)); }
      .form-pane { border-left: 0; border-top: 1px solid rgba(255,255,255,.06); }
    }

    @media (prefers-reduced-motion: reduce) {
      .media-pane video { display: none !important; }
    }

<body>
  <section class="page" data-i18n-aria="start.title" aria-label="Bog‘lanish">
    <a href="/" class="back-link btn btn-ghost" data-i18n="start.back">← Portfolio</a>

    <div class="split-m">
      <!-- Left: wider video stage -->
      <div class="media-pane relative">
        <div class="media-pane__stage">
          <video
            id="start-motion-video"
            src="assets/services-motion.mp4"
            muted
            loop
            playsinline
            autoplay
            preload="auto"
            disablepictureinpicture
            disableremoteplayback
            aria-hidden="true"
            tabindex="-1"
          ></video>
          <div class="veil" aria-hidden="true"></div>
        </div>
        <div class="media-copy">
          <h1 class="text-4xl md:text-5xl font-black uppercase tracking-tight leading-[0.92]" data-i18n="start.name" data-i18n-html>
            Avazov<br>Ogabek
          </h1>
          <p class="mt-4 text-sm text-white/70 leading-relaxed" data-i18n="start.role">
            Full-stack dasturchi · Toshkent. Editorial web + product.
          </p>
        </div>
      </div>

      <!-- Right: compact contact -->
      <div class="form-pane">
        <h2 class="text-2xl md:text-3xl font-black uppercase tracking-tight" data-i18n="start.title">Bog‘lanish</h2>
        <p class="mt-2 text-xs text-white/50 max-w-sm leading-relaxed" data-i18n="start.intro">
          Loyiha, hamkorlik yoki savol — 24 soat ichida javob.
        </p>

        <div class="mt-5 grid gap-1.5">
          <a class="channel" href="mailto:avazovogabek86@gmail.com">
            <span class="dot" aria-hidden="true"><img src="assets/icons/email.svg" alt=""></span>
            <span>
              <span class="block text-[9px] tracking-widest uppercase text-white/40" data-i18n="start.emailLabel">Email</span>
              <span class="text-[13px] font-semibold">avazovogabek86@gmail.com</span>
            </span>
          </a>
          <a class="channel" href="https://t.me/Avazov_fit" target="_blank" rel="noopener noreferrer">
            <span class="dot" aria-hidden="true"><img src="assets/icons/telegram.svg" alt=""></span>
            <span>
              <span class="block text-[9px] tracking-widest uppercase text-white/40" data-i18n="start.tgLabel">Telegram</span>
              <span class="text-[13px] font-semibold">@Avazov_fit</span>
            </span>
          </a>
          <a class="channel" href="https://www.instagram.com/avazov_fit/" target="_blank" rel="noopener noreferrer">
            <span class="dot" aria-hidden="true"><img src="assets/icons/instagram.svg" alt=""></span>
            <span>
              <span class="block text-[9px] tracking-widest uppercase text-white/40" data-i18n="start.igLabel">Instagram</span>
              <span class="text-[13px] font-semibold">@avazov_fit</span>
            </span>
          </a>
        </div>

        <p class="ready-label" data-i18n="start.readyLabel">Tez xabar</p>
        <div class="ready-grid" id="start-ready-grid">
          <button type="button" class="ready-chip" data-i18n="start.chip.landing" data-msg-key="start.msg.landing">Landing</button>
          <button type="button" class="ready-chip" data-i18n="start.chip.portfolio" data-msg-key="start.msg.portfolio">Portfolio</button>
          <button type="button" class="ready-chip" data-i18n="start.chip.startup" data-msg-key="start.msg.startup">Startup</button>
          <button type="button" class="ready-chip" data-i18n="start.chip.uiux" data-msg-key="start.msg.uiux">UI/UX</button>
          <button type="button" class="ready-chip" data-i18n="start.chip.redesign" data-msg-key="start.msg.redesign">Redesign</button>
          <button type="button" class="ready-chip" data-i18n="start.chip.other" data-msg-key="start.msg.other">Boshqa</button>
        </div>

        <form class="mt-4 space-y-2.5" id="start-contact-form">
          <div class="float-wrap">
            <input class="field" id="start-name" name="name" required autocomplete="name" placeholder=" " />
            <label for="start-name" data-i18n="start.phName">Ismingiz</label>
          </div>
          <div class="float-wrap">
            <input class="field" id="start-contact" name="contact" required autocomplete="email" placeholder=" " />
            <label for="start-contact" data-i18n="start.phContact">Email yoki Telegram</label>
          </div>
          <div class="float-wrap">
            <textarea class="field" id="start-message" name="message" required placeholder=" "></textarea>
            <label for="start-message" data-i18n="start.phMessage">Loyiha haqida qisqacha...</label>
          </div>
          <button type="submit" class="btn btn-white w-full" data-i18n="start.submit">Xabar yuborish →</button>
        </form>
        <p id="start-form-note" class="mt-2 text-xs text-white/45 hidden" role="status"></p>
      </div>
    </div>
  </section>

  <script>
    (function () {
      const video = document.getElementById('start-motion-video');
      if (video && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        video.muted = true;
        video.defaultMuted = true;
        video.playsInline = true;
        const play = () => { const p = video.play(); if (p && p.catch) p.catch(() => {}); };
        if ('IntersectionObserver' in window) {
          new IntersectionObserver((entries) => {
            entries.forEach((e) => { if (e.isIntersecting) play(); else video.pause(); });
          }, { threshold: 0.15 }).observe(video);
        } else {
          play();
        }
      }

      const form = document.getElementById('start-contact-form');
      const note = document.getElementById('start-form-note');
      const message = document.getElementById('start-message');
      const chips = document.querySelectorAll('#start-ready-grid .ready-chip');

      const fillMessage = (text) => {
        if (!message || !text) return;
        message.value = text;
        message.dispatchEvent(new Event('input', { bubbles: true }));
        message.focus();
      };

      chips.forEach((chip) => {
        chip.addEventListener('click', () => {
          chips.forEach((c) => c.classList.remove('is-on'));
          chip.classList.add('is-on');
          const key = chip.getAttribute('data-msg-key');
          const text = (window.EchoI18n && key)
            ? window.EchoI18n.t(key)
            : chip.getAttribute('data-msg') || chip.textContent;
          fillMessage(text);
        });
      });

      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const data = new FormData(form);
          const name = String(data.get('name') || '').trim();
          const contact = String(data.get('contact') || '').trim();
          const msg = String(data.get('message') || '').trim();
          const body = encodeURIComponent(
            `Ism: ${name}\nAloqa: ${contact}\n\n${msg}`
          );
          const subject = encodeURIComponent(`Portfolio — ${name}`);
          window.location.href = `mailto:avazovogabek86@gmail.com?subject=${subject}&body=${body}`;
          if (note) {
            note.textContent = 'Email ochilmoqda…';
            note.classList.remove('hidden');
          }
        });
      }
    })();
  </script>
  <script type="module">
    import { initI18n } from './i18n.js?v=uzex1';
    initI18n();
  </script>
</body>
