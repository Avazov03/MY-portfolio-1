<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Sahifa topilmadi | Og‘abek Avazov</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon-avazov.svg?v=bw1" type="image/svg+xml">
  <style>
    :root { --ink: #0d0d0d; --soft: #6b6b6b; --line: #e2e2e2; --bg: #fff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--bg);
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    main { width: 100%; max-width: 560px; text-align: center; }
    .code {
      font-size: clamp(96px, 28vw, 180px);
      font-weight: 900;
      line-height: .9;
      letter-spacing: -.04em;
    }
    .label {
      margin-top: 18px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--soft);
    }
    h1 { margin-top: 20px; font-size: clamp(22px, 5vw, 30px); font-weight: 800; text-transform: uppercase; }
    p { margin-top: 12px; color: var(--soft); line-height: 1.6; font-size: 15px; }
    .actions { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; padding: 0 24px; border-radius: 999px;
      font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
      text-decoration: none; border: 1px solid var(--ink);
    }
    .btn-black { background: var(--ink); color: #fff; }
    .btn-line { color: var(--ink); background: transparent; }
    .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    hr { margin: 40px auto 0; width: 64px; border: 0; border-top: 1px solid var(--line); }
    .brand { margin-top: 16px; font-size: 11px; font-weight: 800; letter-spacing: .3em; color: var(--soft); }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <div class="label">Xato · Error · Ошибка</div>
    <h1>Sahifa topilmadi</h1>
    <p>Siz qidirgan sahifa mavjud emas yoki ko‘chirilgan. Bosh sahifadan loyihalar va xizmatlarni ko‘rishingiz mumkin.</p>
    <div class="actions">
      <a class="btn btn-black" href="/">Bosh sahifa</a>
      <a class="btn btn-line" href="/start.html">Bog‘lanish</a>
    </div>
    <hr>
    <div class="brand">AVAZOV</div>
  </main>
</body>
</html>
