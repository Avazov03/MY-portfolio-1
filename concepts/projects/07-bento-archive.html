<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>07 · Bento Archive (20)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; background: #FAFAFA; color: #121212; }
    .tile { transition: transform .3s cubic-bezier(.16,1,.3,1); overflow: hidden; }
    .tile:hover { transform: translateY(-2px); }
    .tile img { transition: transform .6s cubic-bezier(.16,1,.3,1); }
    .tile:hover img { transform: scale(1.05); }
  </style>
</head>
<body>
  <div class="max-w-[1400px] mx-auto px-6 md:px-14 py-6 flex justify-between">
    <a href="./index.html" class="text-[11px] font-bold tracking-widest uppercase text-neutral-500">← CONCEPT LAB</a>
    <p class="text-[11px] font-mono text-neutral-400">07 / BENTO ARCHIVE · 20</p>
  </div>

  <header class="max-w-[1400px] mx-auto px-6 md:px-14 pb-8">
    <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tight">Selected Works</h1>
    <p class="mt-2 text-sm text-neutral-500">2 ta featured katta, qolganlari zich bento. 20 ta joylashadi, muhimlari oldinda.</p>
  </header>

  <main id="grid" class="max-w-[1400px] mx-auto px-6 md:px-14 pb-24 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3 md:gap-4 auto-rows-[140px] md:auto-rows-[160px]"></main>

  <script type="module">
    import { PROJECTS } from './projects-data-20.js';
    const grid = document.getElementById('grid');
    const featured = PROJECTS.filter(p => p.featured);
    const rest = PROJECTS.filter(p => !p.featured);

    const cells = [
      ...featured.map((p, i) => ({ p, span: i === 0 ? 'col-span-2 row-span-2 md:col-span-3 md:row-span-2' : 'col-span-2 row-span-2 md:col-span-3 md:row-span-2' })),
      ...rest.map(p => ({ p, span: 'col-span-1 row-span-1 md:col-span-2 lg:col-span-2' }))
    ];

    // First 2 featured large, next 4 medium, rest small
    grid.innerHTML = PROJECTS.map((p, i) => {
      let span = 'col-span-1 row-span-1 md:col-span-2';
      if (i === 0) span = 'col-span-2 row-span-2 md:col-span-4 md:row-span-2';
      else if (i === 1) span = 'col-span-2 row-span-2 md:col-span-2 md:row-span-2';
      else if (i < 6) span = 'col-span-1 row-span-1 md:col-span-2';
      return `
        <a href="${p.link}" target="_blank" rel="noopener" class="tile ${span} relative rounded-2xl md:rounded-3xl border border-neutral-200 bg-neutral-100 group">
          <img src="${p.src}" alt="${p.title}" class="absolute inset-0 w-full h-full object-cover object-top" loading="lazy">
          <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-transparent"></div>
          <div class="absolute left-3 right-3 bottom-3 text-white">
            <p class="text-[9px] font-mono tracking-widest text-white/70">${String(i+1).padStart(2,'0')} · ${p.tag.toUpperCase()}</p>
            <h2 class="text-sm md:text-lg font-black uppercase tracking-tight leading-tight">${p.title}</h2>
          </div>
        </a>
      `;
    }).join('');
  </script>
</body>
</html>
