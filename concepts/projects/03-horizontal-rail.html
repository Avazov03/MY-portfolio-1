<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>03 · Horizontal Rail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; background: #0D0D0D; color: #fff; }
    .rail {
      display: flex;
      gap: 1.25rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-padding-left: 1.5rem;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 0 1.5rem 2rem;
    }
    .rail::-webkit-scrollbar { display: none; }
    .slide {
      flex: 0 0 min(78vw, 720px);
      scroll-snap-align: start;
    }
    .slide img { transition: transform .6s cubic-bezier(.16,1,.3,1); }
    .slide:hover img { transform: scale(1.04); }
  </style>
</head>
<body class="min-h-screen">
  <div class="px-6 md:px-14 py-8 flex items-center justify-between">
    <a href="./index.html" class="text-[11px] font-bold tracking-widest uppercase text-neutral-400 hover:text-white">← CONCEPT LAB</a>
    <p class="text-[11px] font-mono tracking-widest text-neutral-500">03 / HORIZONTAL RAIL</p>
  </div>

  <header class="px-6 md:px-14 pb-10">
    <h1 class="text-5xl md:text-7xl font-black uppercase tracking-tight leading-[0.88]">Selected<br>Works</h1>
    <p class="mt-4 text-sm text-neutral-400 max-w-md">Yon tomonga suring yoki trackpad. Experience bo‘limi bilan bir oila — gorizontal hikoya.</p>
  </header>

  <div id="rail" class="rail"></div>

  <div class="px-6 md:px-14 pb-16 flex items-center justify-between text-[11px] font-mono tracking-widest text-neutral-500">
    <span>SCROLL / DRAG →</span>
    <span id="counter">01 / 06</span>
  </div>

  <script type="module">
    import { PROJECTS } from './projects-data.js';
    const rail = document.getElementById('rail');
    rail.innerHTML = PROJECTS.map((p, i) => `
      <article class="slide">
        <div class="rounded-3xl overflow-hidden border border-white/10 bg-white/5 aspect-[16/11]">
          <img src="${p.src}" alt="${p.title}" class="w-full h-full object-cover object-top" loading="lazy">
        </div>
        <div class="mt-4 flex items-start justify-between gap-4">
          <div>
            <p class="text-[10px] font-mono tracking-widest text-neutral-500">${String(i+1).padStart(2,'0')} · ${p.tag.toUpperCase()}</p>
            <h2 class="text-2xl md:text-3xl font-black uppercase tracking-tight mt-1">${p.title}</h2>
            <p class="text-sm text-neutral-400 mt-2 max-w-sm">${p.desc}</p>
          </div>
          <a href="${p.link}" target="_blank" rel="noopener" class="shrink-0 mt-1 px-4 py-2 rounded-full border border-white/20 text-[11px] font-bold tracking-wider uppercase hover:bg-white hover:text-black transition">Live ↗</a>
        </div>
      </article>
    `).join('');

    const counter = document.getElementById('counter');
    const update = () => {
      const slides = [...rail.querySelectorAll('.slide')];
      const left = rail.scrollLeft;
      let best = 0, bestDist = Infinity;
      slides.forEach((s, i) => {
        const d = Math.abs(s.offsetLeft - left);
        if (d < bestDist) { bestDist = d; best = i; }
      });
      counter.textContent = `${String(best+1).padStart(2,'0')} / ${String(PROJECTS.length).padStart(2,'0')}`;
    };
    rail.addEventListener('scroll', update, { passive: true });
    update();
  </script>
</body>
</html>
