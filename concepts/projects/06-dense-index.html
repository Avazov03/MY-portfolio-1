<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>06 · Dense Index (20)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; background: #FAFAFA; color: #121212; }
    .row { border-top: 1px solid #E8E8E8; transition: background .2s; }
    .row:hover { background: #fff; }
    .thumb { opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .25s; pointer-events: none; }
    .row:hover .thumb { opacity: 1; transform: translateY(0); }
    .chip { border: 1px solid #D6D6D6; border-radius: 9999px; }
    .chip.active { background: #0D0D0D; color: #fff; border-color: #000; }
    .sticky-bar { backdrop-filter: blur(10px); background: rgba(250,250,250,.9); }
  </style>
</head>
<body>
  <div class="max-w-[1400px] mx-auto px-6 md:px-14 py-6 flex justify-between">
    <a href="./index.html" class="text-[11px] font-bold tracking-widest uppercase text-neutral-500">← CONCEPT LAB</a>
    <p class="text-[11px] font-mono text-neutral-400">06 / DENSE INDEX · 20</p>
  </div>

  <header class="max-w-[1400px] mx-auto px-6 md:px-14 pb-6">
    <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tight">Loyihalar</h1>
    <p class="mt-2 text-sm text-neutral-500">Zich jadval. Hover — preview. 20 ta loyiha bir ko‘rinishda.</p>
  </header>

  <div class="sticky top-0 z-20 sticky-bar border-y border-neutral-200">
    <div class="max-w-[1400px] mx-auto px-6 md:px-14 py-3 flex flex-wrap items-center gap-3 justify-between">
      <div id="chips" class="flex flex-wrap gap-2"></div>
      <input id="q" type="search" placeholder="Qidirish..." class="px-4 py-2 rounded-full border border-neutral-300 text-xs w-full sm:w-56 focus:outline-none focus:border-black">
    </div>
  </div>

  <main id="list" class="max-w-[1400px] mx-auto px-6 md:px-14 pb-24"></main>

  <script type="module">
    import { PROJECTS } from './projects-data-20.js';
    let tag = 'All';
    let q = '';
    const filters = ['All', 'Web', 'Landing', 'Client'];

    const chips = document.getElementById('chips');
    const list = document.getElementById('list');
    document.getElementById('q').addEventListener('input', (e) => { q = e.target.value.toLowerCase(); paint(); });

    function filtered() {
      return PROJECTS.filter(p => {
        const okTag = tag === 'All' || p.tag === tag;
        const okQ = !q || `${p.title} ${p.subtitle} ${p.desc}`.toLowerCase().includes(q);
        return okTag && okQ;
      });
    }

    function paint() {
      chips.innerHTML = filters.map(f => `<button data-f="${f}" class="chip px-3 py-1.5 text-[10px] font-bold tracking-wider uppercase ${tag===f?'active':''}">${f}</button>`).join('');
      chips.querySelectorAll('button').forEach(b => b.onclick = () => { tag = b.dataset.f; paint(); });

      const rows = filtered();
      list.innerHTML = `
        <div class="hidden md:grid grid-cols-12 gap-4 py-3 text-[10px] font-mono tracking-widest text-neutral-400 uppercase">
          <div class="col-span-1">#</div><div class="col-span-4">Loyiha</div><div class="col-span-2">Tur</div><div class="col-span-2">Yil</div><div class="col-span-3">Stack</div>
        </div>
        ${rows.map((p, i) => `
          <a href="${p.link}" target="_blank" rel="noopener" class="row relative grid grid-cols-12 gap-4 items-center py-4">
            <div class="col-span-2 md:col-span-1 text-[11px] font-mono text-neutral-400">${String(i+1).padStart(2,'0')}</div>
            <div class="col-span-10 md:col-span-4">
              <div class="font-bold uppercase tracking-tight text-sm md:text-base">${p.title}</div>
              <div class="text-[11px] text-neutral-500">${p.subtitle}</div>
            </div>
            <div class="hidden md:block col-span-2 text-xs font-semibold tracking-wider uppercase text-neutral-600">${p.tag}</div>
            <div class="hidden md:block col-span-2 text-xs font-mono text-neutral-500">${p.year}</div>
            <div class="hidden md:block col-span-3 text-[11px] text-neutral-500 truncate">${p.stack.join(' · ')}</div>
            <div class="thumb absolute right-0 top-1/2 -translate-y-1/2 w-40 h-24 rounded-xl overflow-hidden border border-neutral-200 shadow-lg hidden lg:block">
              <img src="${p.src}" alt="" class="w-full h-full object-cover object-top">
            </div>
          </a>
        `).join('')}
        <p class="pt-6 text-[11px] font-mono text-neutral-400">${rows.length} / ${PROJECTS.length} loyiha</p>
      `;
    }
    paint();
  </script>
</body>
</html>
