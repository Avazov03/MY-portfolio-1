<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>04 · Filter Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; background: #FAFAFA; color: #121212; }
    .chip { border: 1px solid #D6D6D6; border-radius: 9999px; transition: all .2s; }
    .chip.active { background: #0D0D0D; color: #fff; border-color: #0D0D0D; }
    .tile { transition: transform .3s cubic-bezier(.16,1,.3,1); }
    .tile:hover { transform: translateY(-3px); }
    .tile img { transition: transform .6s cubic-bezier(.16,1,.3,1); }
    .tile:hover img { transform: scale(1.04); }
  </style>
</head>
<body>
  <div class="max-w-[1400px] mx-auto px-6 md:px-14 py-8 flex items-center justify-between">
    <a href="./index.html" class="text-[11px] font-bold tracking-widest uppercase text-neutral-500 hover:text-black">← CONCEPT LAB</a>
    <p class="text-[11px] font-mono tracking-widest text-neutral-400">04 / FILTER LAB</p>
  </div>

  <header class="max-w-[1400px] mx-auto px-6 md:px-14 pb-8">
    <h1 class="text-5xl md:text-7xl font-black uppercase tracking-tight">Archive</h1>
    <div id="chips" class="mt-6 flex flex-wrap gap-2"></div>
  </header>

  <main id="grid" class="max-w-[1400px] mx-auto px-6 md:px-14 pb-24 grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></main>

  <script type="module">
    import { PROJECTS } from './projects-data.js';
    const filters = ['All', 'Web', 'Landing', 'Client'];
    let active = 'All';

    const chips = document.getElementById('chips');
    const grid = document.getElementById('grid');

    function renderChips() {
      chips.innerHTML = filters.map(f => `
        <button type="button" data-f="${f}" class="chip px-4 py-2 text-[11px] font-bold tracking-wider uppercase ${active===f?'active':''}">${f}</button>
      `).join('');
      chips.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        active = b.dataset.f;
        paint();
      }));
    }

    function paint() {
      renderChips();
      const list = active === 'All' ? PROJECTS : PROJECTS.filter(p => p.tag === active);
      grid.innerHTML = list.map(p => `
        <a href="${p.link}" target="_blank" rel="noopener" class="tile block rounded-3xl border border-neutral-200 bg-white overflow-hidden">
          <div class="aspect-[4/3] overflow-hidden bg-neutral-100">
            <img src="${p.src}" alt="${p.title}" class="w-full h-full object-cover object-top" loading="lazy">
          </div>
          <div class="p-5">
            <div class="flex items-center justify-between gap-2">
              <p class="text-[10px] font-mono tracking-widest text-neutral-400">${p.tag.toUpperCase()} · ${p.year}</p>
              <span class="text-[10px] font-bold tracking-wider uppercase">↗</span>
            </div>
            <h2 class="mt-2 text-xl font-black uppercase tracking-tight">${p.title}</h2>
            <p class="mt-2 text-xs text-neutral-600 leading-relaxed">${p.desc}</p>
          </div>
        </a>
      `).join('');
    }

    paint();
  </script>
</body>
</html>
