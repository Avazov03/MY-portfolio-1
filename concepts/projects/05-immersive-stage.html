<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>05 · Immersive Stage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; background: #FAFAFA; color: #121212; }
    .stage-frame {
      box-shadow: 0 25px 60px -20px rgba(0,0,0,.25);
      border: 1px solid #E5E5E5;
    }
    #media { transition: opacity .4s ease, transform .5s cubic-bezier(.16,1,.3,1); }
    .nav-btn {
      width: 3rem; height: 3rem; border-radius: 9999px; border: 1px solid #D1D1D1;
      display: inline-flex; align-items: center; justify-content: center;
      transition: transform .25s, border-color .25s, background .25s;
    }
    .nav-btn:hover { transform: scale(1.06); border-color: #000; background: #f0f0f0; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div class="max-w-[1400px] w-full mx-auto px-6 md:px-14 py-8 flex items-center justify-between">
    <a href="./index.html" class="text-[11px] font-bold tracking-widest uppercase text-neutral-500 hover:text-black">← CONCEPT LAB</a>
    <p class="text-[11px] font-mono tracking-widest text-neutral-400">05 / IMMERSIVE STAGE</p>
  </div>

  <main class="flex-1 max-w-[1400px] w-full mx-auto px-6 md:px-14 pb-16 flex flex-col">
    <div class="flex items-end justify-between gap-4 mb-6">
      <div>
        <p id="meta" class="text-[10px] font-mono tracking-widest text-neutral-400"></p>
        <h1 id="title" class="text-4xl md:text-6xl font-black uppercase tracking-tight leading-[0.9]"></h1>
      </div>
      <p id="count" class="text-sm font-mono text-neutral-400 shrink-0"></p>
    </div>

    <div class="stage-frame relative rounded-[28px] overflow-hidden bg-neutral-100 aspect-[16/9] md:aspect-[21/10]">
      <img id="media" src="" alt="" class="absolute inset-0 w-full h-full object-cover object-top">
    </div>

    <div class="mt-6 grid md:grid-cols-12 gap-6 items-start">
      <p id="desc" class="md:col-span-7 text-sm md:text-base text-neutral-600 leading-relaxed"></p>
      <div class="md:col-span-5 flex flex-col sm:flex-row md:flex-col gap-3 md:items-end">
        <div id="stack" class="flex flex-wrap gap-2 md:justify-end"></div>
        <div class="flex items-center gap-2">
          <button type="button" id="prev" class="nav-btn" aria-label="Previous">←</button>
          <button type="button" id="next" class="nav-btn" aria-label="Next">→</button>
          <a id="live" href="#" target="_blank" rel="noopener" class="ml-2 px-5 py-2.5 rounded-full bg-black text-white text-[11px] font-bold tracking-wider uppercase hover:bg-neutral-800">Live site ↗</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { PROJECTS } from './projects-data.js';
    let i = 0;

    function show(n) {
      i = (n + PROJECTS.length) % PROJECTS.length;
      const p = PROJECTS[i];
      const media = document.getElementById('media');
      media.style.opacity = '0';
      media.style.transform = 'scale(1.02)';
      setTimeout(() => {
        media.src = p.src;
        media.alt = p.title;
        media.style.opacity = '1';
        media.style.transform = 'scale(1)';
      }, 180);
      document.getElementById('meta').textContent = `${p.tag.toUpperCase()} · ${p.year} · ${p.subtitle.toUpperCase()}`;
      document.getElementById('title').textContent = p.title;
      document.getElementById('desc').textContent = p.desc;
      document.getElementById('count').textContent = `${String(i+1).padStart(2,'0')} / ${String(PROJECTS.length).padStart(2,'0')}`;
      document.getElementById('live').href = p.link;
      document.getElementById('stack').innerHTML = p.stack.map(s =>
        `<span class="px-3 py-1 rounded-full border border-neutral-300 text-[10px] font-bold tracking-wider uppercase text-neutral-600">${s}</span>`
      ).join('');
    }

    document.getElementById('prev').onclick = () => show(i - 1);
    document.getElementById('next').onclick = () => show(i + 1);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') show(i - 1);
      if (e.key === 'ArrowRight') show(i + 1);
    });

    show(0);
  </script>
</body>
</html>
