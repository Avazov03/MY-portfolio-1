<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>09 · Command Board (20)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; background: #0D0D0D; color: #fff; }
    .item { border-top: 1px solid rgba(255,255,255,.08); }
    .item.active, .item:hover { background: rgba(255,255,255,.04); }
    .kbd { border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 2px 6px; font-size: 10px; }
  </style>
</head>
<body class="min-h-screen">
  <div class="max-w-6xl mx-auto px-6 py-6 flex justify-between items-center">
    <a href="./index.html" class="text-[11px] font-bold tracking-widest uppercase text-neutral-400">← CONCEPT LAB</a>
    <p class="text-[11px] font-mono text-neutral-500">09 / COMMAND BOARD · 20 · <span class="kbd">↑↓</span> <span class="kbd">Enter</span></p>
  </div>

  <header class="max-w-6xl mx-auto px-6 pb-6">
    <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tight">Find a project</h1>
    <div class="mt-6 relative">
      <input id="q" autofocus type="search" placeholder="Nom, tag yoki stack..." class="w-full bg-white/5 border border-white/15 rounded-2xl px-5 py-4 text-sm focus:outline-none focus:border-white/40 placeholder:text-neutral-600">
    </div>
  </header>

  <div class="max-w-6xl mx-auto px-6 pb-20 grid lg:grid-cols-12 gap-6">
    <div id="list" class="lg:col-span-7 max-h-[65vh] overflow-y-auto rounded-2xl border border-white/10"></div>
    <aside class="lg:col-span-5">
      <div class="sticky top-6 rounded-3xl overflow-hidden border border-white/10 bg-white/5">
        <div class="aspect-[16/11] bg-black/40 relative">
          <img id="prev" src="" alt="" class="absolute inset-0 w-full h-full object-cover object-top opacity-90">
        </div>
        <div class="p-5">
          <p id="meta" class="text-[10px] font-mono tracking-widest text-neutral-500"></p>
          <h2 id="title" class="text-2xl font-black uppercase tracking-tight mt-1"></h2>
          <p id="desc" class="text-sm text-neutral-400 mt-2"></p>
          <a id="live" href="#" target="_blank" rel="noopener" class="inline-flex mt-4 px-4 py-2 rounded-full bg-white text-black text-[11px] font-bold tracking-wider uppercase">Open ↗</a>
        </div>
      </div>
    </aside>
  </div>

  <script type="module">
    import { PROJECTS } from './projects-data-20.js';
    let q = '';
    let active = 0;
    const list = document.getElementById('list');

    function rows() {
      return PROJECTS.filter(p => !q || `${p.title} ${p.tag} ${p.stack.join(' ')} ${p.desc}`.toLowerCase().includes(q));
    }

    function paint() {
      const data = rows();
      if (active >= data.length) active = Math.max(0, data.length - 1);
      list.innerHTML = data.map((p, i) => `
        <button type="button" data-i="${i}" class="item w-full text-left px-4 py-3 flex items-center gap-4 ${i===active?'active':''}">
          <span class="text-[11px] font-mono text-neutral-600 w-6">${String(i+1).padStart(2,'0')}</span>
          <span class="flex-1 min-w-0">
            <span class="block font-bold uppercase tracking-tight text-sm truncate">${p.title}</span>
            <span class="block text-[11px] text-neutral-500 truncate">${p.tag} · ${p.year} · ${p.stack.join(' / ')}</span>
          </span>
        </button>
      `).join('') || `<p class="p-6 text-sm text-neutral-500">Hech narsa topilmadi.</p>`;

      list.querySelectorAll('button').forEach(b => {
        b.onmouseenter = () => { active = +b.dataset.i; paint(); };
        b.onclick = () => window.open(data[+b.dataset.i].link, '_blank');
      });

      const p = data[active];
      if (!p) return;
      document.getElementById('prev').src = p.src;
      document.getElementById('meta').textContent = `${p.tag.toUpperCase()} · ${p.year}`;
      document.getElementById('title').textContent = p.title;
      document.getElementById('desc').textContent = p.desc;
      document.getElementById('live').href = p.link;
    }

    document.getElementById('q').addEventListener('input', (e) => { q = e.target.value.toLowerCase(); active = 0; paint(); });
    window.addEventListener('keydown', (e) => {
      const data = rows();
      if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(data.length-1, active+1); paint(); list.querySelector(`[data-i="${active}"]`)?.scrollIntoView({ block: 'nearest' }); }
      if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active-1); paint(); list.querySelector(`[data-i="${active}"]`)?.scrollIntoView({ block: 'nearest' }); }
      if (e.key === 'Enter' && data[active]) window.open(data[active].link, '_blank');
    });
    paint();
  </script>
</body>
</html>
