<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>01 · Editorial Index</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; background: #FAFAFA; color: #121212; }
    .project-row { border-top: 1px solid #E5E5E5; }
    .project-row:last-child { border-bottom: 1px solid #E5E5E5; }
    .project-row img { transition: transform .7s cubic-bezier(.16,1,.3,1); }
    .project-row:hover img { transform: scale(1.03); }
    .pill { border: 1px solid #D6D6D6; border-radius: 9999px; }
  </style>
</head>
<body>
  <div class="max-w-[1400px] mx-auto px-6 md:px-14 py-8 flex items-center justify-between">
    <a href="./index.html" class="text-[11px] font-bold tracking-widest uppercase text-neutral-500 hover:text-black">← CONCEPT LAB</a>
    <p class="text-[11px] font-mono tracking-widest text-neutral-400">01 / EDITORIAL INDEX</p>
  </div>

  <header class="max-w-[1400px] mx-auto px-6 md:px-14 pt-6 pb-14">
    <p class="text-[11px] font-bold tracking-widest uppercase text-neutral-500 mb-3">LOYIHALAR</p>
    <h1 class="text-5xl md:text-7xl font-black uppercase tracking-tight leading-[0.88]">Tanlangan<br>Loyiha</h1>
    <p class="mt-5 max-w-lg text-sm text-neutral-600">Har bir case — to‘liq qator. Scroll qilib o‘qing, hover qilib chuqurlashing.</p>
  </header>

  <main id="list" class="max-w-[1400px] mx-auto px-6 md:px-14 pb-24"></main>

  <script type="module">
    import { PROJECTS } from './projects-data.js';
    const root = document.getElementById('list');
    root.innerHTML = PROJECTS.map((p, i) => `
      <article class="project-row py-10 md:py-14 grid md:grid-cols-12 gap-6 md:gap-10 items-center">
        <div class="md:col-span-5 order-2 md:order-1">
          <p class="text-[10px] font-mono tracking-widest text-neutral-400 mb-3">${String(i+1).padStart(2,'0')} / ${p.tag.toUpperCase()} · ${p.year}</p>
          <h2 class="text-3xl md:text-5xl font-black uppercase tracking-tight leading-[0.92]">${p.title}</h2>
          <p class="mt-2 text-xs font-semibold tracking-widest uppercase text-neutral-500">${p.subtitle}</p>
          <p class="mt-4 text-sm text-neutral-600 leading-relaxed max-w-md">${p.desc}</p>
          <div class="mt-5 flex flex-wrap gap-2">
            ${p.stack.map(s => `<span class="pill px-3 py-1 text-[10px] font-bold tracking-wider uppercase text-neutral-600">${s}</span>`).join('')}
          </div>
          <a href="${p.link}" target="_blank" rel="noopener" class="inline-flex mt-6 px-5 py-2.5 rounded-full bg-black text-white text-[11px] font-bold tracking-wider uppercase hover:bg-neutral-800 transition">Live site ↗</a>
        </div>
        <div class="md:col-span-7 order-1 md:order-2 overflow-hidden rounded-2xl bg-neutral-100 border border-neutral-200 aspect-[16/10]">
          <img src="${p.src}" alt="${p.title}" class="w-full h-full object-cover object-top" loading="lazy">
        </div>
      </article>
    `).join('');
  </script>
</body>
</html>
