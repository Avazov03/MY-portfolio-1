<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>10 · Peek Drawer (20)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; background: #FAFAFA; color: #121212; }
    .card { transition: transform .25s cubic-bezier(.16,1,.3,1), border-color .2s; }
    .card:hover { transform: translateY(-2px); border-color: #000; }
    #drawer { transform: translateX(100%); transition: transform .4s cubic-bezier(.16,1,.3,1); }
    #drawer.open { transform: translateX(0); }
    #veil { opacity: 0; pointer-events: none; transition: opacity .3s; }
    #veil.open { opacity: 1; pointer-events: auto; }
    .chip { border: 1px solid #D6D6D6; border-radius: 9999px; }
    .chip.active { background: #0D0D0D; color: #fff; border-color: #000; }
  </style>
</head>
<body>
  <div class="max-w-[1400px] mx-auto px-6 md:px-14 py-6 flex justify-between">
    <a href="./index.html" class="text-[11px] font-bold tracking-widest uppercase text-neutral-500">← CONCEPT LAB</a>
    <p class="text-[11px] font-mono text-neutral-400">10 / PEEK DRAWER · 20</p>
  </div>

  <header class="max-w-[1400px] mx-auto px-6 md:px-14 pb-6">
    <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tight">All Projects</h1>
    <p class="mt-2 text-sm text-neutral-500">Gridda 20 ta. Click — yon panelda to‘liq info, sahifa tarkibida qolasiz.</p>
    <div id="chips" class="mt-5 flex flex-wrap gap-2"></div>
  </header>

  <main id="grid" class="max-w-[1400px] mx-auto px-6 md:px-14 pb-24 grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></main>

  <div id="veil" class="fixed inset-0 bg-black/40 z-40"></div>
  <aside id="drawer" class="fixed top-0 right-0 h-full w-full max-w-md bg-white z-50 shadow-2xl border-l border-neutral-200 overflow-y-auto">
    <div class="p-5 flex justify-between items-center border-b border-neutral-200">
      <p class="text-[10px] font-mono tracking-widest text-neutral-400">PROJECT DETAIL</p>
      <button id="close" class="w-9 h-9 rounded-full border border-neutral-300 text-sm">✕</button>
    </div>
    <div class="aspect-[16/11] bg-neutral-100">
      <img id="d-img" src="" alt="" class="w-full h-full object-cover object-top">
    </div>
    <div class="p-6">
      <p id="d-meta" class="text-[10px] font-mono tracking-widest text-neutral-400"></p>
      <h2 id="d-title" class="text-3xl font-black uppercase tracking-tight mt-1"></h2>
      <p id="d-desc" class="mt-3 text-sm text-neutral-600 leading-relaxed"></p>
      <div id="d-stack" class="mt-4 flex flex-wrap gap-2"></div>
      <a id="d-live" href="#" target="_blank" rel="noopener" class="inline-flex mt-6 px-5 py-2.5 rounded-full bg-black text-white text-[11px] font-bold tracking-wider uppercase">Live site ↗</a>
    </div>
  </aside>

  <script type="module">
    import { PROJECTS } from './projects-data-20.js';
    let tag = 'All';
    const filters = ['All', 'Web', 'Landing', 'Client'];
    const chips = document.getElementById('chips');
    const grid = document.getElementById('grid');
    const drawer = document.getElementById('drawer');
    const veil = document.getElementById('veil');

    function open(p) {
      document.getElementById('d-img').src = p.src;
      document.getElementById('d-meta').textContent = `${p.tag.toUpperCase()} · ${p.year} · ${p.subtitle.toUpperCase()}`;
      document.getElementById('d-title').textContent = p.title;
      document.getElementById('d-desc').textContent = p.desc;
      document.getElementById('d-live').href = p.link;
      document.getElementById('d-stack').innerHTML = p.stack.map(s =>
        `<span class="px-3 py-1 rounded-full border border-neutral-300 text-[10px] font-bold tracking-wider uppercase">${s}</span>`
      ).join('');
      drawer.classList.add('open');
      veil.classList.add('open');
    }
    function close() {
      drawer.classList.remove('open');
      veil.classList.remove('open');
    }
    document.getElementById('close').onclick = close;
    veil.onclick = close;
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

    function paint() {
      chips.innerHTML = filters.map(f =>
        `<button data-f="${f}" class="chip px-3 py-1.5 text-[10px] font-bold tracking-wider uppercase ${tag===f?'active':''}">${f}</button>`
      ).join('');
      chips.querySelectorAll('button').forEach(b => b.onclick = () => { tag = b.dataset.f; paint(); });

      const list = tag === 'All' ? PROJECTS : PROJECTS.filter(p => p.tag === tag);
      grid.innerHTML = list.map((p, i) => `
        <button type="button" data-id="${p.id}" class="card text-left rounded-2xl border border-neutral-200 bg-white overflow-hidden">
          <div class="aspect-[4/3] bg-neutral-100 overflow-hidden">
            <img src="${p.src}" alt="" class="w-full h-full object-cover object-top" loading="lazy">
          </div>
          <div class="p-4">
            <p class="text-[10px] font-mono text-neutral-400">${String(i+1).padStart(2,'0')} · ${p.tag.toUpperCase()}</p>
            <h2 class="font-black uppercase tracking-tight text-sm mt-1">${p.title}</h2>
          </div>
        </button>
      `).join('');
      grid.querySelectorAll('button').forEach(b => {
        const p = PROJECTS.find(x => x.id === b.dataset.id);
        b.onclick = () => open(p);
      });
    }
    paint();
  </script>
</body>
</html>
