<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>05 · Venture Cards</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; background: #FAFAFA; color: #0D0D0D; }
    .row { transition: border-color .25s; }
    .row:hover { border-color: #0D0D0D; }
    .row img { transition: transform .55s cubic-bezier(.16,1,.3,1); }
    .row:hover img { transform: scale(1.03); }
  </style>
</head>
<body class="min-h-screen">
  <div class="max-w-[1400px] mx-auto px-6 md:px-10 pt-8 pb-4 flex items-center justify-between">
    <a href="./index.html" class="text-[11px] font-bold tracking-widest uppercase text-neutral-500 hover:text-black">← Concept lab</a>
    <p class="text-[10px] font-mono tracking-widest text-neutral-400">05 / VENTURE CARDS</p>
  </div>

  <section class="max-w-[1400px] mx-auto px-6 md:px-10 pt-6 pb-20">
    <p class="text-[11px] font-bold tracking-widest uppercase text-neutral-500 mb-2">Case strip</p>
    <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tight leading-[0.9] mb-3">Landing page lar</h1>
    <p class="text-sm text-neutral-500 max-w-lg mb-12">Har startap — to‘liq editorial qator. Scroll qilib chuqurroq o‘qing.</p>

    <div id="list" class="flex flex-col gap-5"></div>
  </section>

  <script type="module">
    import { STARTUPS } from './startups-data.js';
    const list = document.getElementById('list');

    list.innerHTML = STARTUPS.map((s, i) => `
      <article class="row rounded-[28px] border border-neutral-200 bg-white overflow-hidden grid md:grid-cols-2 ${i % 2 === 1 ? 'md:[&>div:first-child]:order-2' : ''}">
        <div class="relative aspect-[16/11] md:aspect-auto md:min-h-[360px] overflow-hidden bg-neutral-100">
          <img src="${s.src}" alt="${s.name}" class="absolute inset-0 w-full h-full object-cover object-top" />
        </div>
        <div class="flex flex-col justify-between p-7 md:p-10">
          <div>
            <div class="flex items-center justify-between gap-3 mb-5">
              <span class="text-[10px] font-mono tracking-widest text-neutral-400">0${i + 1} — ${s.year}</span>
              <span class="text-[10px] font-bold tracking-widest uppercase text-neutral-500">${s.tag}</span>
            </div>
            <h2 class="text-3xl md:text-4xl font-black uppercase tracking-tight">${s.name}</h2>
            <p class="mt-3 text-lg font-semibold text-neutral-800">${s.headline}</p>
            <p class="mt-3 text-sm text-neutral-500 leading-relaxed">${s.pitch}</p>
            <p class="mt-4 text-[11px] font-medium uppercase tracking-wider text-neutral-400">${s.role}</p>
          </div>
          <div class="mt-8 flex flex-wrap items-center justify-between gap-4">
            <div class="flex flex-wrap gap-1.5">
              ${s.tools.map(t => `<span class="text-[10px] font-semibold uppercase tracking-wider px-2.5 py-1 rounded-full border border-neutral-200 text-neutral-600">${t}</span>`).join('')}
            </div>
            <a href="${s.href}" class="inline-flex items-center gap-2 px-6 py-3 rounded-full bg-black text-white text-[11px] font-bold uppercase tracking-wider hover:bg-neutral-800 transition">${s.cta} →</a>
          </div>
        </div>
      </article>
    `).join('');
  </script>
</body>
</html>
