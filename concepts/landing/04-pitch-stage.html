<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>04 · Pitch Stage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; background: #FAFAFA; color: #0D0D0D; }
    .idx-btn { transition: border-color .2s, background .2s; }
    .idx-btn.active { border-color: #0D0D0D; background: #0D0D0D; color: #fff; }
    .fade { animation: fade .4s cubic-bezier(.16,1,.3,1); }
    @keyframes fade {
      from { opacity: 0; transform: scale(.985); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="min-h-screen">
  <div class="max-w-[1400px] mx-auto px-6 md:px-10 pt-8 pb-4 flex items-center justify-between">
    <a href="./index.html" class="text-[11px] font-bold tracking-widest uppercase text-neutral-500 hover:text-black">← Concept lab</a>
    <p class="text-[10px] font-mono tracking-widest text-neutral-400">04 / PITCH STAGE</p>
  </div>

  <section class="max-w-[1400px] mx-auto px-6 md:px-10 pt-4 pb-16">
    <p class="text-[11px] font-bold tracking-widest uppercase text-neutral-500 mb-2">Founder ventures</p>
    <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tight leading-[0.9] mb-10">Landing page lar</h1>

    <div class="grid lg:grid-cols-[280px_1fr] gap-6 lg:gap-8 items-start">
      <aside id="index" class="flex lg:flex-col gap-2 overflow-x-auto lg:overflow-visible pb-2 lg:pb-0"></aside>
      <div id="stage" class="rounded-[32px] border border-neutral-200 overflow-hidden bg-neutral-100 min-h-[560px] relative"></div>
    </div>
  </section>

  <script type="module">
    import { STARTUPS } from './startups-data.js';
    let active = 0;
    const indexEl = document.getElementById('index');
    const stage = document.getElementById('stage');

    function render() {
      const s = STARTUPS[active];
      indexEl.innerHTML = STARTUPS.map((item, i) => `
        <button type="button" data-i="${i}" class="idx-btn shrink-0 text-left w-full min-w-[200px] rounded-2xl border border-neutral-200 bg-white px-4 py-4 ${i === active ? 'active' : 'hover:border-neutral-400'}">
          <span class="block text-[10px] font-mono tracking-widest opacity-60 mb-1">0${i + 1}</span>
          <span class="block text-sm font-black uppercase tracking-tight">${item.name}</span>
          <span class="block text-[11px] mt-1 ${i === active ? 'text-white/70' : 'text-neutral-500'}">${item.tag}</span>
        </button>
      `).join('');

      indexEl.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => { active = Number(btn.dataset.i); render(); });
      });

      stage.innerHTML = `
        <div class="fade absolute inset-0">
          <img src="${s.src}" alt="${s.name}" class="absolute inset-0 w-full h-full object-cover object-top" />
          <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
          <div class="absolute bottom-0 left-0 right-0 p-8 md:p-12 text-white">
            <p class="text-[11px] font-bold tracking-widest uppercase text-white/60 mb-3">${s.role} · ${s.year}</p>
            <h2 class="text-3xl md:text-5xl font-black uppercase tracking-tight max-w-2xl">${s.headline}</h2>
            <p class="mt-4 text-sm md:text-base text-white/75 max-w-xl leading-relaxed">${s.pitch}</p>
            <div class="mt-6 flex flex-wrap gap-2">
              ${s.metrics.map(m => `<span class="text-[10px] font-semibold uppercase tracking-wider px-3 py-1.5 rounded-full border border-white/25 bg-white/10">${m}</span>`).join('')}
            </div>
            <a href="${s.href}" class="mt-8 inline-flex items-center gap-2 px-7 py-3.5 rounded-full bg-white text-black text-[11px] font-bold uppercase tracking-wider hover:bg-neutral-200 transition">${s.cta} →</a>
          </div>
        </div>
      `;
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { active = (active + 1) % STARTUPS.length; render(); }
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { active = (active - 1 + STARTUPS.length) % STARTUPS.length; render(); }
    });
    render();
  </script>
</body>
</html>
