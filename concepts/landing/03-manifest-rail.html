<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>03 · Manifest Rail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; background: #0D0D0D; color: #FAFAFA; }
    .rail {
      display: flex; gap: 1.25rem; overflow-x: auto; scroll-snap-type: x mandatory;
      padding: 0 1.5rem 2rem; scrollbar-width: none;
    }
    .rail::-webkit-scrollbar { display: none; }
    .slide {
      flex: 0 0 min(92vw, 1100px); scroll-snap-align: center;
      border-radius: 28px; overflow: hidden; position: relative;
      height: min(72vh, 620px); background: #1a1a1a;
    }
    .slide img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .slide .veil { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,.85) 100%); }
  </style>
</head>
<body class="min-h-screen">
  <div class="max-w-[1400px] mx-auto px-6 md:px-10 pt-8 pb-4 flex items-center justify-between">
    <a href="./index.html" class="text-[11px] font-bold tracking-widest uppercase text-neutral-400 hover:text-white">← Concept lab</a>
    <p class="text-[10px] font-mono tracking-widest text-neutral-500">03 / MANIFEST RAIL</p>
  </div>

  <header class="max-w-[1400px] mx-auto px-6 md:px-10 pt-4 pb-8">
    <p class="text-[11px] font-bold tracking-widest uppercase text-neutral-500 mb-2">Campaign energy</p>
    <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tight leading-[0.9]">Landing page lar</h1>
    <p class="mt-3 text-sm text-neutral-400">Chap-o‘ng swipe · har startap to‘liq sahna</p>
  </header>

  <div id="rail" class="rail"></div>
  <div id="dots" class="flex justify-center gap-2 pb-12"></div>

  <script type="module">
    import { STARTUPS } from './startups-data.js';
    const rail = document.getElementById('rail');
    const dots = document.getElementById('dots');

    rail.innerHTML = STARTUPS.map((s, i) => `
      <article class="slide border border-white/10">
        <img src="${s.src}" alt="${s.name}" />
        <div class="veil"></div>
        <div class="absolute top-5 left-5 right-5 flex justify-between text-[10px] font-mono tracking-widest text-white/70">
          <span>0${i + 1} / 03</span>
          <span>${s.tag.toUpperCase()} · ${s.year}</span>
        </div>
        <div class="absolute bottom-0 left-0 right-0 p-6 md:p-10">
          <h2 class="text-3xl md:text-5xl font-black uppercase tracking-tight">${s.name}</h2>
          <p class="mt-2 text-lg md:text-2xl font-medium text-white/90">${s.headline}</p>
          <p class="mt-3 text-sm text-white/60 max-w-xl leading-relaxed">${s.pitch}</p>
          <a href="${s.href}" class="mt-6 inline-flex items-center gap-2 px-6 py-3 rounded-full bg-white text-black text-[11px] font-bold uppercase tracking-wider hover:bg-neutral-200 transition">${s.cta} →</a>
        </div>
      </article>
    `).join('');

    dots.innerHTML = STARTUPS.map((_, i) =>
      `<button type="button" data-i="${i}" class="w-2 h-2 rounded-full bg-white/30 hover:bg-white transition" aria-label="Slide ${i + 1}"></button>`
    ).join('');

    const slides = [...rail.querySelectorAll('.slide')];
    const dotBtns = [...dots.querySelectorAll('button')];

    function setActive(i) {
      dotBtns.forEach((d, j) => d.classList.toggle('bg-white', j === i));
      dotBtns.forEach((d, j) => d.classList.toggle('bg-white/30', j !== i));
    }

    rail.addEventListener('scroll', () => {
      const mid = rail.scrollLeft + rail.clientWidth / 2;
      let best = 0, bestDist = Infinity;
      slides.forEach((el, i) => {
        const c = el.offsetLeft + el.offsetWidth / 2;
        const d = Math.abs(c - mid);
        if (d < bestDist) { bestDist = d; best = i; }
      });
      setActive(best);
    }, { passive: true });

    dotBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        slides[Number(btn.dataset.i)].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      });
    });
    setActive(0);
  </script>
</body>
</html>
