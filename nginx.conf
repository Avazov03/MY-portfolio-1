server {
  listen 80;
  listen [::]:80;
  server_name avazov-dev.uz www.avazov-dev.uz _;

  root /usr/share/nginx/html;
  index index.html;

  # Long-cache static assets; HTML stays fresh
  location ~* \.(?:css|js|mjs|map|jpg|jpeg|png|gif|webp|svg|ico|mp4|webm|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Don't serve hidden / tooling paths
  location ~ /\. {
    deny all;
  }
}
