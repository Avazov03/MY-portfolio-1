server {
  listen 80;
  listen [::]:80;
  server_name avazov-dev.uz www.avazov-dev.uz _;

  root /usr/share/nginx/html;
  index index.html;

  # Hide nginx version in the Server header
  server_tokens off;

  # Behind the host HTTPS proxy: emit relative Location headers
  # (avoids http:// or :80 leaking into redirects)
  absolute_redirect off;

  # Compression (HTML, CSS, JS incl. ES modules, SVG, JSON, XML)
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json
             application/xml application/manifest+json image/svg+xml text/plain;

  # Real 404 page for unknown paths (no homepage fallback)
  error_page 404 /404.html;

  # /index.html → / (one canonical homepage URL; keeps ?lang=...)
  if ($request_uri ~ "^/index\.html(\?.*)?$") {
    return 301 /$1;
  }

  # Long-cache static assets; HTML stays fresh
  # .mjs must be served as JavaScript (module scripts) so it is also gzipped
  location ~* \.mjs$ {
    types { application/javascript mjs; }
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:css|js|map|jpg|jpeg|png|gif|webp|svg|ico|mp4|webm|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location = /robots.txt {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location = /sitemap.xml {
    add_header Cache-Control "public, max-age=3600";
    default_type application/xml;
    try_files $uri =404;
  }

  location = /site.webmanifest {
    add_header Cache-Control "public, max-age=86400";
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # Draft / lab paths — keep out of search indexes
  location ^~ /concepts/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/ =404;
  }

  location = /404.html {
    internal;
    add_header X-Robots-Tag "noindex" always;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  # Don't serve hidden / tooling paths
  location ~ /\. {
    deny all;
  }
}
